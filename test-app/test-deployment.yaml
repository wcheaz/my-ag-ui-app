apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-health-app
  labels:
    app: test-health-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-health-app
  template:
    metadata:
      labels:
        app: test-health-app
    spec:
      containers:
      - name: test-health-app
        image: test-health-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: HEALTH_CHECK_PATH
          value: "/api/health"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: test-health-app-service
spec:
  selector:
    app: test-health-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer