apiVersion: v1
kind: Secret
metadata:
  name: my-ag-ui-app-secrets
  labels:
    app: my-ag-ui-app
type: Opaque
data:
  # Base64 encoded values for sensitive environment variables
  # IMPORTANT: Run ./k8s/setup-secrets.sh to generate this file with actual values
  # DO NOT HARDCODE SENSITIVE VALUES HERE
  openai-api-key: 
  openai-base-url: 
  openai-model: 
  embedding-model: 
  logfire-token: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-ag-ui-app-config
  labels:
    app: my-ag-ui-app
data:
  # Non-sensitive configuration values
  llm-max-tokens: "4096"
  llm-context-window: "8192"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-ag-ui-app-tls-secret
  labels:
    app: my-ag-ui-app
type: kubernetes.io/tls
data:
  # TLS certificate and key (placeholder - replace with actual certificates)
  # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt
  tls.crt: 
  tls.key: 