apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ag-ui-app
  labels:
    app: my-ag-ui-app
    # Pod Security Standards labels
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.29
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.29
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-ag-ui-app
  template:
    metadata:
      labels:
        app: my-ag-ui-app
      annotations:
        # Enable seccomp profile for restricted pod security standards
        container.seccomp.security.alpha.kubernetes.io/my-ag-ui-app: runtime/default
    spec:
      # Security context for the pod
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: my-ag-ui-app
        # Security context for the container
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        image: my-ag-ui-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        # OpenAI Configuration
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: my-ag-ui-app-secrets
              key: openai-api-key
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: my-ag-ui-app-secrets
              key: openai-base-url
        - name: OPENAI_MODEL
          valueFrom:
            secretKeyRef:
              name: my-ag-ui-app-secrets
              key: openai-model
        # Procurement Agent Configuration
        - name: LLM_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: my-ag-ui-app-config
              key: llm-max-tokens
        - name: LLM_CONTEXT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: my-ag-ui-app-config
              key: llm-context-window
        - name: EMBEDDING_MODEL
          valueFrom:
            secretKeyRef:
              name: my-ag-ui-app-secrets
              key: embedding-model
        # Logging Configuration
        - name: LOGFIRE_TOKEN
          valueFrom:
            secretKeyRef:
              name: my-ag-ui-app-secrets
              key: logfire-token
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Temporary volume for writable directories
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.next/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}