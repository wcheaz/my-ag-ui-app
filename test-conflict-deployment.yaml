apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ag-ui-app
  labels:
    app: my-ag-ui-app
  # Intentionally using an old resource version to create conflict
  resourceVersion: "627253"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-ag-ui-app
  template:
    metadata:
      labels:
        app: my-ag-ui-app
    spec:
      containers:
      - name: my-ag-ui-app
        image: localhost:32000/my-ag-ui-app:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: openai-api-key
              name: my-ag-ui-app-secrets
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              key: openai-base-url
              name: my-ag-ui-app-secrets
        - name: OPENAI_MODEL
          valueFrom:
            secretKeyRef:
              key: openai-model
              name: my-ag-ui-app-secrets
        - name: EMBEDDING_MODEL
          valueFrom:
            secretKeyRef:
              key: embedding-model
              name: my-ag-ui-app-secrets
        - name: LOGFIRE_TOKEN
          valueFrom:
            secretKeyRef:
              key: logfire-token
              name: my-ag-ui-app-secrets
        - name: LLM_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              key: llm-max-tokens
              name: my-ag-ui-app-config
        - name: LLM_CONTEXT_WINDOW
          valueFrom:
            configMapKeyRef:
              key: llm-context-window
              name: my-ag-ui-app-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      imagePullSecrets:
      - name: registry-secret
      restartPolicy: Always
