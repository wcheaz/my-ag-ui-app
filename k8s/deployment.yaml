apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ag-ui-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-ag-ui-app
  template:
    metadata:
      labels:
        app: my-ag-ui-app
    spec:
      containers:
      - name: my-ag-ui-app
        image: localhost:32000/my-ag-ui-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: AGENT_URL
          value: "http://agent-service:8000/"
        envFrom:
        - secretRef:
            name: my-ag-ui-app-secrets
        - configMapRef:
            name: my-ag-ui-app-config
