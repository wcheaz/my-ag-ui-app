---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-ag-ui-app-config
  namespace: default
  labels:
    app: my-ag-ui-app
data:
  # Non-sensitive configuration values
  llm-max-tokens: "8192"
  llm-context-window: "128000"
  
  # Infrastructure configuration values
  # Application port configuration
  app-port: "3000"
  service-port: "80"
  
  # Resource limits and requests
  cpu-request: "100m"
  cpu-limit: "500m"
  memory-request: "256Mi"
  memory-limit: "512Mi"
  
  # Liveness probe configuration
  liveness-initial-delay-seconds: "30"
  liveness-period-seconds: "10"
  liveness-timeout-seconds: "5"
  liveness-failure-threshold: "3"
  
  # Readiness probe configuration
  readiness-initial-delay-seconds: "5"
  readiness-period-seconds: "5"
  readiness-timeout-seconds: "3"
  readiness-failure-threshold: "3"
  
  # Ingress configuration
  ingress-host: "my-ag-ui-app.local"
  ingress-path: "/"
  ingress-rewrite-target: "/"
  ingress-class-name: "nginx"
