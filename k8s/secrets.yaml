  openai-api-key: c2stMzYyMzYyYTU5OWEwNGJjZDg1NjlhNTljNTZlMjNmMTY=
  openai-base-url: aHR0cHM6Ly9hcGkuZGVlcHNlZWsuY29t
  openai-model: ZGVlcHNlZWstY2hhdA==
  embedding-model: QkFBSS9iZ2UtbGFyZ2UtZW4tdjEuNQ==
